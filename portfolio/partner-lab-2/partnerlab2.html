<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Daily Edit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="greeting">Hello, friend!</h1>
    
    <p id="message">Today is a fresh start. Make it yours.</p>
    <h2>Personalize Your Daily Edit</h2>
    <label for="username">Your Name:</label>
    <input type="text" id="username" placeholder="Enter your name">
    <br><br>
    <label for="customMessage">Your Daily Message:</label>
    <input type="text" id="customMessage" placeholder="Write your message">
    <br><br>
    <label for="backgroundColor">Choose a Background Color:</label>
    <select id="backgroundColor">
        <option value="F5EEE8">Cream</option>
        <option value="F2D9D5">Soft Pink</option>
        <option value="E5E5D5">Sage</option>
        <option value="DDE6ED">Light Blue</option>
        <option value="F4E7C7">Butter Yellow</option>
    </select>
    <br><br>

<h2>Today's To-Do List</h2>

<label for="taskInput">Add a Task:</label>
<input type="text" id="taskInput" placeholder="What do you need to do today?">

<button type="button" id="addTaskButton">Add Task</button>

<ol id="taskList"></ol>

    <button type="button" id="updateButton">Update My Page</button>

    <script src="index.js"></script>

<a href="../index.html" style="display: inline-block; margin: 25px; padding: 12px 20px; background-color: #383833; color: white; text-decoration: none; border-radius: 6px;">
    Back to Portfolio
</a>

</body>








</html>
